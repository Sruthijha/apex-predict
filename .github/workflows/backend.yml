name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (leakage, simulation, explain, database)
        run: pytest tests/ -v --ignore=tests/test_api.py --ignore=tests/test_model_inference.py

      # test_api.py and test_model_inference.py need a seeded DB and trained
      # models; they self-skip without that, exactly as they do here. A full
      # pipeline run (network + training) is deliberately not part of CI -
      # see docs/IMPLEMENTATION_PLAN.md for why (network dependency, runtime).
      - name: Integration tests (self-skip if data/models aren't present)
        run: pytest tests/test_api.py tests/test_model_inference.py -v
